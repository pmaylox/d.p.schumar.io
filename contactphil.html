<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Phil</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="javascript/contact-config.js" defer></script>
    <script src="javascript/contact-form.js" defer></script>
</head>
<body class="contact-page">
    <header class="site-header" style="font-family: 'MedievalSharp', 'Cinzel Decorative', cursive;">
        <div class="title-row">
            <div class="title-left">
                <img src="images/sprites/d.p. schumar crest.png" alt="D.P. Schu-mar crest" class="site-logo" width="1024" height="1536">
            </div>
            <h1 id="grad">
                <img src="images/Golden Gothic Welcome Banner Blue.png" alt="Welcome to the official D.P. Schu-mar page" class="welcome-banner">
            </h1>
            <div class="title-right">
                <img src="images/sprites/d.p. schumar crest.png" alt="" class="site-logo" width="1024" height="1536">
            </div>
        </div>

        <div class="header-grid">
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html" class="sprite-link home" aria-label="home">
                        Home</a></li>
                    <li><a href="phil.html" class="sprite-link phil" aria-label="Visit Phil">
                        <img src="images/sprites/Phil/miniMe-transparent.png" alt="" width="614" height="929">
                        Go to <strong>Phil</strong>, he becons you</a></li>
                    <li><a href="coachdj.html" class="sprite-link coachdj">
                        <img src="images/sprites/dj/coachdj.png" alt="" width="1024" height="1536">
                        Coach<strong> DJ</strong> wants to teach you padawan.</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="contact-form-content">
        <p>Please fill out the form below to contact Phil.</p>
     <form id="contact-form" method="post" target="_blank" rel="noopener">
        <input type="hidden" name="recipient" value="Phil">
        <input type="hidden" name="submission-id">
        <div style="position:absolute;left:-10000px" aria-hidden="true">
            <label for="website">Leave this field empty</label>
            <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
        </div>
        <label for="first-name">First Name:</label>
        <input type="text" id="first-name" name="first-name" autocomplete="given-name" maxlength="100" required>
        <label for="last-name">Last Name:</label>
        <input type="text" id="last-name" name="last-name" autocomplete="family-name" maxlength="100" required>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" autocomplete="email" maxlength="254" required>
        <label for="message">Message:</label>
        <textarea id="message" name="message" maxlength="5000" required></textarea>
        <button type="submit" disabled>Submit</button>
        <p id="contact-form-status" role="status"></p>
    </form>
    </main>

    <footer>
        <p style="color:blue;">&copy; Copyright:2026 D.P. ent. All Rights Reserved</p>
    </footer>
</body>
</html>
